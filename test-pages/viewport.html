<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELDR — Viewport test</title>
    <link rel="stylesheet" href="/src/ui/shell.css" />
    <link rel="stylesheet" href="/src/ui/viewport.css" />
    <style>
      body { overflow: hidden; }
      .layout { display: grid; grid-template-columns: 1fr 240px; height: calc(100% - 42px); }
      #viewport-host { min-width: 0; min-height: 0; }
      .side { background: #1f2026; border-left: 1px solid #000; padding: 12px 14px; font-size: 13px; display: flex; flex-direction: column; gap: 12px; }
      .side label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .side select, .side button { background: #111216; color: var(--text); border: 1px solid #34353d; border-radius: 3px; padding: 3px 8px; font: inherit; }
      .help { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 0; }
      kbd { background: #111216; border: 1px solid #34353d; border-radius: 3px; padding: 0 4px; font-size: 11px; }
    </style>
  </head>
  <body>
    <header class="topbar"><span class="app-name">ELDR</span><span class="app-version">viewport test · step 1.2</span></header>
    <div class="layout">
      <div id="viewport-host"></div>
      <aside class="side">
        <button type="button" id="play">⏸ Pause</button>
        <label>Frame size
          <select id="size">
            <option value="128">128 × 128</option>
            <option value="256" selected>256 × 256</option>
            <option value="512">512 × 512</option>
            <option value="384x192">384 × 192</option>
          </select>
        </label>
        <label>Pivot
          <select id="pivot">
            <option value="center">Centre</option>
            <option value="bottom">Bottom centre</option>
          </select>
        </label>
        <p class="help">
          Pinch (or <kbd>⌘</kbd> + scroll) to zoom around the cursor.<br />
          Scroll or drag to pan.<br />
          Double-click to fit.<br /><br />
          The effect is rendered at the frame size, then shown at the zoom level. Zoomed in, you
          see the exact pixels the sprite sheet will contain.
        </p>
      </aside>
    </div>
    <script type="module" src="./viewport-page.js"></script>
  </body>
</html>
