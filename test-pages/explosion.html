<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELDR — Explosion</title>
    <link rel="stylesheet" href="/src/ui/shell.css" />
    <link rel="stylesheet" href="/src/ui/viewport.css" />
    <link rel="stylesheet" href="/src/ui/timeline.css" />
    <link rel="stylesheet" href="/src/ui/inspector.css" />
    <style>
      body { overflow: hidden; }
      .topbar .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; font-size: 13px; }
      .topbar input, .topbar button, .topbar select { background: #111216; color: var(--text); border: 1px solid #34353d; border-radius: 3px; padding: 3px 8px; font: inherit; }
      .topbar input { width: 100px; }
      .topbar .frame-fields input { width: 76px; }
      .side-actions { display: flex; gap: 6px; flex-wrap: nowrap; }
      .side-actions button { white-space: nowrap; padding: 4px 8px; }
      .side-head { flex-wrap: wrap; gap: 4px 8px; }
      .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr) 360px; grid-template-rows: minmax(0, 1fr) auto auto; flex: 1; min-height: 0; }
      #layers-host { grid-row: 1 / span 3; background: #1f2026; border-right: 1px solid #000; overflow-y: auto; min-width: 0; }
      #viewport-host { min-width: 0; min-height: 0; }
      #timeline-host { grid-column: 2; min-width: 0; }
      #layertl-host { grid-column: 2; min-width: 0; max-height: 34vh; overflow-y: auto; border-top: 1px solid #000; }
      .side { grid-row: 1 / span 3; grid-column: 3; background: #1f2026; border-left: 1px solid #000; overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable; min-width: 0; }
      .topbar .sep { width: 1px; align-self: stretch; background: #34353d; margin: 0 4px; }
      .topbar button:disabled { opacity: 0.45; }
      /* floats over the editor so showing it never shifts the viewport (pen tool needs a steady canvas) */
      .notice { position: fixed; z-index: 40; bottom: 28px; left: 50%; transform: translateX(-50%); max-width: min(760px, 70vw); margin: 0; padding: 8px 16px; background: #2b2417; color: #f0c46a; font-size: 13px; border: 1px solid #5a4a22; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.45); pointer-events: none; }
      .side-head { display: flex; align-items: center; justify-content: space-between; padding-right: 16px; }
      .side-head button { background: #111216; color: var(--text); border: 1px solid #34353d; border-radius: 3px; padding: 4px 10px; font: inherit; font-size: 12.5px; margin-top: 8px; }
      .side-title { padding: 10px 16px 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #ff8a3d; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <span class="app-name">ELDR</span><span class="app-version">explosion</span>
      <span class="tools">
        <label>Preset <select id="preset"></select></label>
        <button type="button" id="save-preset" title="Save the current explosion to My presets (in this browser)">Save as my preset…</button>
        <button type="button" id="delete-preset" title="Delete the selected preset from My presets" disabled>Delete</button>
        <span class="sep"></span>
        <button type="button" id="open-file" title="Open a saved .eldr.json file">Open file…</button>
        <button type="button" id="save-file" title="Download the current explosion as a .eldr.json file">Save file…</button>
        <input type="file" id="file-input" accept=".json,application/json" hidden />
        <span class="sep"></span>
        <label>Frame <select id="size"></select></label>
        <span class="frame-fields"><input id="frame-w" type="number" title="Frame width (px)" aria-label="Frame width" /> × <input id="frame-h" type="number" title="Frame height (px)" aria-label="Frame height" /></span>
        <label>Seed <input id="seed" type="number" /></label>
        <button type="button" id="dice" title="New seed">🎲</button>
        <button type="button" id="undo" title="Undo (⌘Z)">↶ Undo</button>
        <button type="button" id="redo" title="Redo (⇧⌘Z)">↷ Redo</button>
        <button type="button" id="reset">Reset</button>
        <button type="button" id="export">Export…</button>
        <button type="button" id="shortcuts" title="All shortcuts, as buttons (?)">⌨ Shortcuts</button>
      </span>
    </header>
    <p id="notice" class="notice" hidden></p>
    <div class="layout">
      <aside id="layers-host"></aside>
      <div id="viewport-host"></div>
      <div id="timeline-host"></div>
      <div id="layertl-host"></div>
      <aside class="side">
        <div id="globals-host"></div>
        <div class="side-head">
          <div class="side-title" id="layer-title"></div>
          <span class="side-actions">
            <button type="button" id="layer-centre" title="Centre the layer in the frame (⇧C or ⌘/Ctrl+Home)">⊕ Centre</button>
            <button type="button" id="layer-centre-anchor" title="Put the anchor point on the layer's centre without moving it (⇧⌥C or ⌘⌥/Ctrl+Alt+Home)">⌖ Anchor</button>
            <button type="button" id="layer-ramps" title="Colour ramp library: preview every ramp on this layer, click to apply">🎨 Ramps</button>
            <button type="button" id="layer-reseed" title="New randomness for this layer only">🎲 Reseed</button>
          </span>
        </div>
        <div id="layer-settings-host"></div>
        <div id="layer-transform-host"></div>
        <div id="layer-texture-host"></div>
        <div id="layer-masks-host"></div>
        <div id="layer-host"></div>
      </aside>
    </div>
    <script type="module" src="./explosion-page.js"></script>
  </body>
</html>
