<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELDR — Inspector demo</title>
    <link rel="stylesheet" href="/src/ui/shell.css" />
    <link rel="stylesheet" href="/src/ui/inspector.css" />
    <style>
      body { overflow: hidden; }
      .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; flex: 1; min-height: 0; }
      .left { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; overflow: auto; }
      .right { background: #1f2026; border-left: 1px solid #000; overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable; min-width: 0; }
      .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .toolbar button { background: #111216; color: var(--text); border: 1px solid #34353d; border-radius: 3px; padding: 5px 10px; cursor: pointer; }
      .toolbar button:hover { border-color: #ff8a3d; }
      .note { color: var(--muted); font-size: 13px; margin: 0; max-width: 520px; text-align: center; }
      .json-wrap { width: 100%; max-width: 640px; }
      #json { width: 100%; height: 220px; background: #0d0d10; color: #b9bac4; border: 1px solid #34353d; font: 12px/1.4 ui-monospace, monospace; padding: 8px; resize: vertical; }
      #warnings { color: #ffb86b; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; margin: 6px 0 0; }
      #preview { background: #2a2b31; }
    </style>
  </head>
  <body>
    <header class="topbar"><span class="app-name">ELDR</span><span class="app-version">inspector demo · step 0.3</span></header>
    <div class="layout">
      <div class="left">
        <canvas id="preview" width="320" height="320"></canvas>
        <div class="toolbar">
          <button type="button" id="variant">🎲 New variant</button>
          <button type="button" id="reset">Reset all</button>
          <button type="button" id="apply">Load JSON from box</button>
          <button type="button" id="docs">Show generated docs</button>
        </div>
        <p class="note">Every control on the right is generated from the schema in <code>test-pages/inspector-schema.js</code>. The preview is a throwaway drawing just to show the values are live.</p>
        <div class="json-wrap">
          <textarea id="json" spellcheck="false" aria-label="Parameter JSON"></textarea>
          <p id="warnings"></p>
        </div>
      </div>
      <aside class="right" id="inspector"></aside>
    </div>
    <script type="module" src="./inspector-page.js"></script>
  </body>
</html>
