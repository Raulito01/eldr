<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELDR — Blob playground</title>
    <link rel="stylesheet" href="/src/ui/shell.css" />
    <link rel="stylesheet" href="/src/ui/viewport.css" />
    <link rel="stylesheet" href="/src/ui/timeline.css" />
    <link rel="stylesheet" href="/src/ui/inspector.css" />
    <style>
      body { overflow: hidden; }
      .topbar { gap: 16px; }
      .topbar .tools { display: flex; gap: 8px; align-items: center; margin-left: auto; font-size: 13px; }
      .topbar input, .topbar button { background: #111216; color: var(--text); border: 1px solid #34353d; border-radius: 3px; padding: 3px 8px; font: inherit; }
      .topbar input { width: 100px; }
      .layout { display: grid; grid-template-columns: 1fr 340px; grid-template-rows: 1fr auto; height: calc(100% - 42px); }
      #viewport-host { min-width: 0; min-height: 0; }
      #inspector-host { grid-row: 1 / span 2; grid-column: 2; background: #1f2026; border-left: 1px solid #000; overflow-y: auto; }
      #timeline-host { grid-column: 1; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <span class="app-name">ELDR</span><span class="app-version">blob playground · step 1.4</span>
      <span class="tools">
        <label>Seed <input id="seed" type="number" /></label>
        <button type="button" id="dice" title="New seed">🎲</button>
        <button type="button" id="variant" title="Randomize parameters that have a variant range">Variant</button>
        <button type="button" id="reset">Reset</button>
      </span>
    </header>
    <div class="layout">
      <div id="viewport-host"></div>
      <aside id="inspector-host"></aside>
      <div id="timeline-host"></div>
    </div>
    <script type="module" src="./blob-page.js"></script>
  </body>
</html>
